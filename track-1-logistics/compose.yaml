services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: Ngf-Root#2026
      MYSQL_DATABASE: northgate
    ports:
      - "3306:3306"

  api:
    build: ./backend
    environment:
      NORTHGATE_DB: "Server=db;Port=3306;Database=northgate;User ID=northgate_app;Password=Ngf-App#2026;"
    ports:
      - "5080:8080"
    depends_on:
      - db
